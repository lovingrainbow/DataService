[workspace]
resolver = "2"
members = [
    "crates/machine-model",
    "crates/mm-drivers",
    "crates/plc-data-service",
    "crates/datasvc-demo",
    "src-tauri",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["ArgonGUI Team", "DataService Authors"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
thiserror = "1.0"
tauri = { version = "2.0", features = [] }
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
